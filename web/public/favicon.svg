<!--
  The sidebar's BrandMark, made to survive 16px: same hexagon and clock hand,
  on the same gradient badge the app draws behind it in CSS.

  Two things differ from the component, both because of the size. The badge is
  painted here rather than inherited, since a favicon has no surrounding
  element to take colour from — and it carries its own background so the mark
  stays legible on a light or a dark browser tab, with no media query needed.
  The strokes are thicker than the component's 1.6: at 16px a hairline
  disappears into the tab strip.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#2a78d6" />
      <stop offset="1" stop-color="#1c5cab" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#badge)" />

  <g
    transform="translate(4 4)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
  >
    <path d="M12 2.5 20.5 7.5V16.5L12 21.5 3.5 16.5V7.5Z" />
    <path d="M12 12V6.75" />
  </g>
  <circle cx="16" cy="16" r="1.8" fill="#ffffff" />
</svg>
