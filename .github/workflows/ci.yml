name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      # Override with a DOCKERHUB_NAMESPACE repository variable to publish
      # somewhere else without touching this file.
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'paganim' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Only publish from main; pull requests just prove the image builds.
          push: ${{ github.event_name == 'push' }}
          tags: |
            docker.io/${{ env.NAMESPACE }}/kubeclaude:latest
            docker.io/${{ env.NAMESPACE }}/kubeclaude:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
